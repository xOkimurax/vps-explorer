version: '3.8'

services:
  backend:
    build: ./backend
    container_name: vps-explorer-backend
    ports:
      - "4001:4001"
    volumes:
      - /:/host:ro
      - /tmp:/tmp
    environment:
      - PORT=4001
      - NODE_ENV=production
      - HOST_ROOT=/host
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vps-explorer-frontend
    ports:
      - "4000:4000"
    depends_on:
      - backend
    restart: unless-stopped
