version: '3.8'

services:
  backend:
    build: ./backend
    container_name: vps-explorer-backend
    ports:
      - "4001:4001"
    volumes:
      - /:/host:ro
      - /tmp:/tmp
      - /root/.claude:/host/root/.claude:rw
    environment:
      - PORT=4001
      - NODE_ENV=production
      - HOST_ROOT=/host
      - WHISPER_HOST=host.docker.internal
      - WHISPER_PORT=9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vpsnet

  frontend:
    build: ./frontend
    container_name: vps-explorer-frontend
    ports:
      - "4000:4000"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vpsnet

networks:
  vpsnet:
    name: vps-explorer_default
    external: true
